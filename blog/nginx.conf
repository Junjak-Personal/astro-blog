worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 80;
    server_name   _;

    root   /var/www/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;
    types {
      font/ttf   ttf;
      font/otf   otf;
    }

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    location = /404.html {
            root /var/www/html;
            internal;
    }

    location / {
            try_files $uri $uri/index.html =404;

            # HTML (and any non-hashed asset) must revalidate, so a redeploy never
            # leaves a stale page pointing at purged _astro/[hash].js → 404 → dead islands.
            add_header Cache-Control "no-cache";

            # content-hashed assets are safe to cache forever (nested add_header
            # replaces the inherited no-cache for these extensions only)
            location ~* \.(?:js|css|woff2?|ttf|otf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable, max-age=31536000";
            }
    }
    location /en/ {
        try_files $uri $uri/index.html =404;
        error_page 404 /en/404/index.html;
        add_header Cache-Control "no-cache";
    }
    location /jp/ {
        try_files $uri $uri/index.html =404;
        error_page 404 /jp/404/index.html;
        add_header Cache-Control "no-cache";
    }
    location /files {
        alias /home/files;

        location ~* \.(webp|jpg|jpeg|png|gif|mp4|mov|webm)$ {
            expires 365d;
            add_header Cache-Control "public, immutable, max-age=31536000";
        }
    }
  }
}
